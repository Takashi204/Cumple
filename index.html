<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1120">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Algo te espera 💜">
<meta property="og:description" content="Falta poco para tu día.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<title>Pronto…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2b1b2e;
    --plum-dark:#1c1120;
    --gold:#c9a15e;
    --blush:#e8b4bc;
    --cream:#f6ede1;
    --lilac:#b9a3d9;
    --lilac-soft:#d9cdec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--plum-dark);}
  body{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-weight:300;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(185,163,217,0.16), transparent 55%),
      radial-gradient(ellipse at 50% 30%, rgba(201,161,94,0.12), transparent 60%),
      linear-gradient(180deg, var(--plum-dark) 0%, var(--plum) 100%);
  }

  /* ---------- FONDO ---------- */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{
    position:absolute;
    border-radius:50%;
    background:var(--lilac-soft);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:0.15;}50%{opacity:0.9;}}

  .petals{
    position:fixed;inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
  }
  .petal{
    position:absolute;
    top:-5%;
    opacity:0.8;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  .petal svg{display:block;}
  @keyframes fall{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    50%{transform:translateY(50vh) translateX(20px) rotate(180deg);}
    100%{transform:translateY(105vh) translateX(-10px) rotate(360deg);}
  }

  /* ---------- CONTENIDO ---------- */
  .wrap{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:7vh 6vw 2vh;
  }
  .eyebrow{
    display:none;
    font-size:13px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:18px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.2s;
  }
  body.abierto .eyebrow{display:block;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }

  .wreath{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:14px 74px;
    opacity:0;
    animation:fadeUp 1.2s ease forwards 0.5s;
  }
  .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(54px,13vw,132px);
    line-height:0.95;
    letter-spacing:0.01em;
  }
  .t-abierto{display:none;}
  body.abierto .t-espera{display:none;}
  body.abierto .t-abierto{display:inline;}
  .w-flower{
    position:absolute;
    top:50%;
    filter:drop-shadow(0 0 8px rgba(185,163,217,0.75));
  }
  .w-flower svg{display:block;transform-origin:50% 100%;}
  .w-flower.left{left:-4px;transform:translateY(-50%) rotate(-18deg);}
  .w-flower.right{right:-4px;transform:translateY(-50%) rotate(18deg) scaleX(-1);}
  .w-flower.left svg, .w-flower.right svg{animation:bloom 1.3s cubic-bezier(0.2,0.9,0.3,1.35) 1.1s both;}

  .sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(20px,3.4vw,30px);
    color:var(--lilac-soft);
    margin:18px 0 30px;
    opacity:0;
    animation:fadeUp 1.2s ease forwards 0.9s;
  }

  /* ---------- CUENTA REGRESIVA ---------- */
  .timer{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(8px,2vw,18px);
    width:min(560px,92vw);
    opacity:0;
    animation:fadeUp 1.2s ease forwards 1.2s;
  }
  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:clamp(14px,3vw,24px) 4px clamp(10px,2.4vw,18px);
    background:rgba(246,237,225,0.05);
    border:1px solid rgba(201,161,94,0.38);
    border-radius:4px;
    box-shadow:0 0 28px rgba(185,163,217,0.10);
  }
  .num{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(32px,9.5vw,64px);
    line-height:1;
    font-feature-settings:'lnum' 1,'tnum' 1;
    font-variant-numeric:lining-nums tabular-nums;
    color:var(--cream);
  }
  .num.tick{animation:tick 0.5s ease;}
  @keyframes tick{from{opacity:0.35;transform:translateY(-5px);}to{opacity:1;transform:none;}}
  .lbl{
    font-size:clamp(9px,2.3vw,12px);
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
  }

  .note{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:clamp(17px,2.6vw,22px);
    color:rgba(246,237,225,0.75);
    max-width:460px;
    line-height:1.5;
    margin-top:30px;
    opacity:0;
    animation:fadeUp 1.2s ease forwards 1.6s;
  }

  /* ---------- CUANDO LLEGA EL DIA ---------- */
  #abierto{display:none;flex-direction:column;align-items:center;}
  body.abierto #cuenta{display:none;}
  body.abierto #abierto{display:flex;}
  #abierto .sub{margin-bottom:0;}
  .btn{
    display:inline-block;
    margin-top:34px;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--plum-dark);
    background:var(--gold);
    padding:17px 40px;
    border-radius:2px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 0 30px rgba(201,161,94,0.35);
    transition:transform 0.3s ease, background 0.3s ease;
    animation:latido 2.6s ease-in-out infinite;
  }
  .btn:hover{background:var(--blush);transform:translateY(-2px);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}
  @keyframes latido{0%,100%{box-shadow:0 0 22px rgba(201,161,94,0.3);}50%{box-shadow:0 0 42px rgba(201,161,94,0.6);}}

  /* ---------- JARDIN ---------- */
  .garden{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:clamp(4px,1.4vw,12px);
    padding:10px 4vw 0;
    min-height:96px;
    overflow:hidden;
  }
  .garden svg{
    display:block;
    transform-origin:50% 100%;
    transform:scale(0);
    opacity:0;
    filter:drop-shadow(0 0 8px rgba(185,163,217,0.7));
    animation:
      bloom 1.3s cubic-bezier(0.2,0.9,0.3,1.35) var(--d) both,
      sway 5s ease-in-out calc(var(--d) + 1.3s) infinite;
  }
  @keyframes bloom{
    0%{transform:scale(0) rotate(-25deg);opacity:0;}
    60%{opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
  }

  /* petalos que salen al desbloquear */
  .burst-petal{
    position:fixed;
    left:50%;top:45%;
    pointer-events:none;
    z-index:20;
    opacity:0;
    animation:burst 2s ease-out forwards;
  }
  .burst-petal svg{display:block;}
  @keyframes burst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.3) rotate(0);}
    15%{opacity:1;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));}
  }

  @media (max-width:640px){
    .wreath{padding:12px 46px;}
    .w-flower.left svg, .w-flower.right svg{width:34px;height:auto;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="petals" id="petals"></div>

<main class="wrap">
  <div class="eyebrow" id="fecha">10 · 12</div>

  <div class="wreath">
    <div class="w-flower left">
      <svg width="50" height="68" viewBox="0 0 44 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 60 L22 26" stroke="#7a5e99" stroke-width="2"/>
        <path d="M22 26 C10 26 4 18 4 10 C4 4 10 0 14 4 C16 6 22 14 22 14 C22 14 28 6 30 4 C34 0 40 4 40 10 C40 18 34 26 22 26Z" fill="#b9a3d9"/>
        <ellipse cx="22" cy="14" rx="5" ry="4" fill="#d9cdec"/>
      </svg>
    </div>
    <h1 class="name"><span class="t-espera">Pronto…</span><span class="t-abierto">Valery</span></h1>
    <div class="w-flower right">
      <svg width="50" height="68" viewBox="0 0 44 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 60 L22 26" stroke="#7a5e99" stroke-width="2"/>
        <path d="M22 26 C10 26 4 18 4 10 C4 4 10 0 14 4 C16 6 22 14 22 14 C22 14 28 6 30 4 C34 0 40 4 40 10 C40 18 34 26 22 26Z" fill="#b9a3d9"/>
        <ellipse cx="22" cy="14" rx="5" ry="4" fill="#d9cdec"/>
      </svg>
    </div>
  </div>

  <div id="cuenta">
    <p class="sub">Falta poco para tu día</p>
    <div class="timer" id="timer" role="timer" aria-label="Tiempo que falta">
      <div class="unit"><span class="num" id="n-dias">00</span><span class="lbl">días</span></div>
      <div class="unit"><span class="num" id="n-horas">00</span><span class="lbl">horas</span></div>
      <div class="unit"><span class="num" id="n-min">00</span><span class="lbl">minutos</span></div>
      <div class="unit"><span class="num" id="n-seg">00</span><span class="lbl">segundos</span></div>
    </div>
    <p class="note">Hay algo esperándote ese día…</p>
  </div>

  <div id="abierto">
    <p class="sub">Ya es tu día</p>
    <p class="note" style="animation:none;opacity:1;margin-top:18px;">Feliz cumpleaños, Valery. Esto es para ti.</p>
    <a class="btn" id="btn-abrir" href="regalo-v7k2m.html">Abrir mi regalo</a>
  </div>
</main>

<div class="garden" id="garden"></div>

<script>
  /* ============ AJUSTES ============ */
  // Se desbloquea a la medianoche del 9 al 10 de diciembre, HORA DE PERU (UTC-5).
  // Es un instante fijo: se abre al mismo momento sin importar la zona horaria del dispositivo.
  // Formato: AAAA-MM-DDTHH:MM:SS-05:00
  var OBJETIVO = new Date('2026-12-10T00:00:00-05:00');
  // Pagina principal a la que lleva el boton cuando llega el dia
  var DESTINO = 'regalo-v7k2m.html';
  /* ================================= */

  var reducido = false;
  // Para probar como se ve el dia del cumple: agrega ?probar al final del link
  var probar = /[?&]probar\b/.test(location.search);
  document.getElementById('btn-abrir').setAttribute('href', DESTINO + (probar ? '?probar' : ''));

  var elDias = document.getElementById('n-dias');
  var elHoras = document.getElementById('n-horas');
  var elMin = document.getElementById('n-min');
  var elSeg = document.getElementById('n-seg');

  function dos(n){ return (n < 10 ? '0' : '') + n; }

  function poner(el, valor, animar){
    if(el.textContent === valor) return;
    el.textContent = valor;
    if(animar && !reducido){
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }
  }

  var intervalo = null;
  var yaAbierto = false;
  var initListo = false;

  function desbloquear(conEfecto){
    if(yaAbierto) return;
    yaAbierto = true;
    document.body.classList.add('abierto');
    document.title = 'Feliz cumpleaños, Valery';
    if(intervalo) clearInterval(intervalo);
    if(conEfecto && !reducido){ rafaga(26, 340); }
  }

  function actualizar(){
    var falta = OBJETIVO.getTime() - Date.now();
    if(probar || falta <= 0){
      desbloquear(!yaAbierto && initListo);
      return;
    }
    var s = Math.floor(falta / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600);  s -= h * 3600;
    var m = Math.floor(s / 60);    s -= m * 60;
    poner(elDias, dos(d), false);
    poner(elHoras, dos(h), true);
    poner(elMin, dos(m), true);
    poner(elSeg, dos(s), true);
  }

  actualizar();
  initListo = true;
  if(!yaAbierto){
    intervalo = setInterval(actualizar, 1000);
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) actualizar();
    });
  }

  /* ---------- flores ---------- */
  function flor(w, c1, c2, d){
    var h = Math.round(w * 1.36);
    return '<svg style="--d:'+d+'s" width="'+w+'" height="'+h+'" viewBox="0 0 44 60" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M22 60 L22 26" stroke="#7a5e99" stroke-width="2"/>'
      + '<path d="M22 26 C10 26 4 18 4 10 C4 4 10 0 14 4 C16 6 22 14 22 14 C22 14 28 6 30 4 C34 0 40 4 40 10 C40 18 34 26 22 26Z" fill="'+c1+'"/>'
      + '<ellipse cx="22" cy="14" rx="5" ry="4" fill="'+c2+'"/></svg>';
  }
  (function jardin(){
    var cont = document.getElementById('garden');
    var ancho = window.innerWidth;
    var cantidad = ancho < 480 ? 7 : (ancho < 900 ? 11 : 15);
    var base = [30, 42, 34, 52, 38, 28, 46, 36];
    var html = '';
    for(var i = 0; i < cantidad; i++){
      var w = base[i % base.length];
      var claro = (i % 2 === 1);
      html += flor(w, claro ? '#d9cdec' : '#b9a3d9', claro ? '#e8b4bc' : '#d9cdec', (1.5 + i * 0.18).toFixed(2));
    }
    cont.innerHTML = html;
  })();

  /* ---------- estrellas ---------- */
  (function estrellas(){
    var cont = document.getElementById('stars');
    for(var i = 0; i < 45; i++){
      var e = document.createElement('div');
      e.className = 'star';
      var t = 1 + Math.random() * 2;
      e.style.left = (Math.random() * 100) + '%';
      e.style.top = (Math.random() * 100) + '%';
      e.style.width = t + 'px';
      e.style.height = t + 'px';
      e.style.animationDelay = (Math.random() * 3) + 's';
      cont.appendChild(e);
    }
  })();

  /* ---------- petalos cayendo ---------- */
  (function petalos(){
    var cont = document.getElementById('petals');
    var colores = ['#b9a3d9', '#d9cdec', '#e8b4bc'];
    for(var i = 0; i < 14; i++){
      var p = document.createElement('div');
      p.className = 'petal';
      var t = 10 + Math.random() * 10;
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.animationDuration = (10 + Math.random() * 10) + 's';
      p.style.animationDelay = '-' + (Math.random() * 15) + 's';
      p.innerHTML = '<svg viewBox="0 0 20 20" width="'+t+'" height="'+t+'"><path d="M10 2 C15 2 18 6 18 10 C18 15 14 18 10 18 C6 18 2 15 2 10 C2 6 5 2 10 2 Z" fill="'+colores[i % 3]+'" opacity="0.7"/></svg>';
      cont.appendChild(p);
    }
  })();

  /* ---------- rafaga de petalos al llegar el dia ---------- */
  function rafaga(cantidad, alcance){
    var colores = ['#b9a3d9', '#d9cdec', '#e8b4bc', '#c9a15e'];
    for(var i = 0; i < cantidad; i++){
      var p = document.createElement('div');
      p.className = 'burst-petal';
      var ang = Math.random() * Math.PI * 2;
      var dist = (0.35 + Math.random() * 0.65) * alcance;
      var t = 10 + Math.random() * 12;
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', (Math.sin(ang) * dist - 30) + 'px');
      p.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      p.innerHTML = '<svg viewBox="0 0 20 20" width="'+t+'" height="'+t+'"><path d="M10 2 C15 2 18 6 18 10 C18 15 14 18 10 18 C6 18 2 15 2 10 C2 6 5 2 10 2 Z" fill="'+colores[i % 4]+'" opacity="0.9"/></svg>';
      document.body.appendChild(p);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2800); })(p);
    }
  }
</script>
</body>
</html>
